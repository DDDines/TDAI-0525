[pytest]
addopts = --cov=Backend --cov-report=term-missing:skip-covered --cov-fail-under=80
filterwarnings =
    ignore:'pkgutil.find_loader' is deprecated and slated for removal in Python 3.14.*:DeprecationWarning:pytesseract\.pytesseract
    ignore:datetime\.datetime\.utcnow\(\) is deprecated and scheduled for removal in a future version.*:DeprecationWarning:jose\.jwt
    ignore:datetime\.datetime\.utcnow\(\) is deprecated and scheduled for removal in a future version.*:DeprecationWarning:openpyxl\.
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
