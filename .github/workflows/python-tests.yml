name: CatalogAI CI

on:
  push:
    paths:
      - "Backend/**"
      - "Frontend/app/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements-backend.txt"
      - "docker-compose.dev.yml"
      - ".env.example"
  pull_request:
    paths:
      - "Backend/**"
      - "Frontend/app/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements-backend.txt"
      - "docker-compose.dev.yml"
      - ".env.example"
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    env:
      FIRST_SUPERUSER_EMAIL: admin@example.com
      FIRST_SUPERUSER_PASSWORD: password
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password
      DATABASE_URL: sqlite:///./ci_backend.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-backend.txt
      - name: Run backend test suite with coverage
        run: >
          python -m pytest -q
          --cov=Backend
          --cov-branch
          --cov-config=.coveragerc
          --cov-report=term-missing:skip-covered

  migration-safety:
    name: Migration safety + alembic upgrade
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_migration.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-backend.txt
      - name: Check migration safety
        run: python scripts/check_migration_safety.py
      - name: Validate alembic head upgrade
        run: python scripts/validate_alembic_upgrade.py

  ops-scripts:
    name: Ops scripts syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python ops scripts
        run: >
          python -m py_compile
          scripts/smoke_release.py
          scripts/check_migration_safety.py
          scripts/validate_alembic_upgrade.py
          scripts/validate_local_llm_workflow.py
      - name: Validate shell ops scripts
        run: >
          bash -n
          scripts/bootstrap-vps.sh
          scripts/deploy-blue-green.sh
          scripts/rollback-blue-green.sh

  oop-strict-no-legacy:
    name: Strict OOP gate
    runs-on: ubuntu-latest
    env:
      APP_MODE: oop
      STRICT_OOP_NO_LEGACY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-backend.txt
      - name: Run strict OOP no-legacy gate
        run: >
          pytest -q --no-cov
          Backend/tests/test_architecture_boundaries.py
          Backend/tests/test_app_mode_pipeline_selector.py
          Backend/tests/test_pipeline_orchestrators.py
          Backend/tests/test_service_container_defaults.py

  frontend:
    name: Frontend lint + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run frontend coverage suite
        run: npm run test:coverage -- --runInBand

  e2e:
    name: End-to-end smoke
    runs-on: windows-latest
    env:
      FIRST_SUPERUSER_EMAIL: admin@example.com
      FIRST_SUPERUSER_PASSWORD: password
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password
      DATABASE_URL: sqlite:///./ci_e2e.db
      AUTO_CREATE_TABLES: "True"
      PLAYWRIGHT_BACKEND_PORT: "8012"
      PLAYWRIGHT_FRONTEND_PORT: "4175"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/app/package-lock.json
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-backend.txt
      - name: Install frontend dependencies
        working-directory: Frontend/app
        run: npm ci
      - name: Prepare e2e backend database
        run: python scripts/prepare_e2e_backend.py
      - name: Install Playwright Chromium
        working-directory: Frontend/app
        run: npx playwright install chromium
      - name: Run end-to-end suite
        working-directory: Frontend/app
        run: npm run test:e2e
